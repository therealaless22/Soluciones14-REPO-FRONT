name: Angular CI-CD - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular para produccion
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estatico
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/proyecto-fe/browser

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4